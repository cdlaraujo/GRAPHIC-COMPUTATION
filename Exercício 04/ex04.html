<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Animação do Robô (Arquivo Único)</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
        }
        canvas {
            border: 2px solid #555;
            background-color: #1a1a1a;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <canvas id="canvas" width="1200" height="600"></canvas>

    <script>
var m3 = {
  identity: function(){
    return [
      1, 0, 0,
      0, 1, 0,
      0, 0, 1
    ];
  },

  multiply: function(a,b){
    var a00 = a[0*3+0];
    var a01 = a[1*3+0];
    var a02 = a[2*3+0];
    var a10 = a[0*3+1];
    var a11 = a[1*3+1];
    var a12 = a[2*3+1];
    var a20 = a[0*3+2];
    var a21 = a[1*3+2];
    var a22 = a[2*3+2];

    var b00 = b[0*3+0];
    var b01 = b[1*3+0];
    var b02 = b[2*3+0];
    var b10 = b[0*3+1];
    var b11 = b[1*3+1];
    var b12 = b[2*3+1];
    var b20 = b[0*3+2];
    var b21 = b[1*3+2];
    var b22 = b[2*3+2];

    return [
      a00*b00+a01*b10+a02*b20, a10*b00+a11*b10+a12*b20, a20*b00+a21*b10+a22*b20,
      a00*b01+a01*b11+a02*b21, a10*b01+a11*b11+a12*b21, a20*b01+a21*b11+a22*b21,
      a00*b02+a01*b12+a02*b22, a10*b02+a11*b12+a12*b22, a20*b02+a21*b12+a22*b22,
    ];
  },

  translation: function(tx,ty){
    return [
      1,  0,  0,
      0,  1,  0,
      tx, ty, 1
    ];
  },

  scaling: function(sx,sy){
    return [
      sx, 0,  0,
      0,  sy, 0,
      0,  0,  1
    ];
  },

  rotation: function(angleInRadians){
    var c = Math.cos(angleInRadians);
    var s = Math.sin(angleInRadians);
    return [
        c, s, 0,
       -s, c, 0,
        0, 0, 1
    ];
  },

  translate: function(m,tx,ty){
    var t = m3.translation(tx,ty);
    return m3.multiply(t,m);
  },

  scale: function(m,sx,sy){
    var s = m3.scaling(sx,sy);
    return m3.multiply(s,m);
  },

  rotate: function(m,angleInRadians){
    var r = m3.rotation(angleInRadians);
    return m3.multiply(r,m);
  },

  setClippingWindow: function(xw_min, yw_min, xw_max, yw_max) {
    // Create the clipping matrix
    var clippingMatrix = [
      2 / (xw_max-xw_min), 0, 0,
      0, 2 / (yw_max-yw_min), 0,
      -(xw_max + xw_min) / (xw_max - xw_min), -(yw_max + yw_min) / (yw_max - yw_min), 1
    ];

    return clippingMatrix;
  }
  
};

    </script>

    <script>
        const canvas = document.getElementById("canvas");
const gl = canvas.getContext("webgl2");

if (!gl) {
    throw new Error("WebGL 2 não é suportado.");
}

const vertexShaderSource = `#version 300 es
in vec2 aPosition;
uniform mat3 u_viewTransform;
uniform mat3 u_modelTransform;

void main() {
    vec3 position = u_viewTransform * u_modelTransform * vec3(aPosition, 1.0);
    gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const fragmentShaderSource = `#version 300 es
precision mediump float;
uniform vec3 uColor;
out vec4 outColor;

void main() {
    outColor = vec4(uColor, 1.0);
}
`;

function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const error = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(error);
    }
    return shader;
}

function createProgram(gl, vertexShaderSource, fragmentShaderSource) {
    const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
    const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
    const program = gl.createProgram();
    
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
    }
    return program;
}

const program = createProgram(gl, vertexShaderSource, fragmentShaderSource);

// ==================================================
// RENDERER & VÉRTICES
// ==================================================

class Renderer {
    constructor(gl, program) {
        this.gl = gl;
        this.program = program;
        this.positionLocation = gl.getAttribLocation(program, "aPosition");
        this.colorLocation = gl.getUniformLocation(program, "uColor");
        this.viewTransformLocation = gl.getUniformLocation(program, "u_viewTransform");
        this.modelTransformLocation = gl.getUniformLocation(program, "u_modelTransform");
        this.viewTransform = m3.identity();
        this.verticesBuffer = gl.createBuffer();
    }

    defineViewTransform(viewTransform) {
        this.viewTransform = viewTransform;
    }

    draw(object) {
        const gl = this.gl;
        gl.bindBuffer(gl.ARRAY_BUFFER, this.verticesBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, object.vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(this.positionLocation);
        gl.vertexAttribPointer(this.positionLocation, 2, gl.FLOAT, false, 0, 0);

        gl.uniform3fv(this.colorLocation, object.color);
        gl.uniformMatrix3fv(this.modelTransformLocation, false, object.modelTransform);
        gl.uniformMatrix3fv(this.viewTransformLocation, false, this.viewTransform);

        gl.drawArrays(gl.TRIANGLES, 0, object.vertices.length / 2);
    }
}

function rectangleVertices(x,y,width,height){
    return [
        x, y,
        x+width, y+height,
        x, y+height,
        x, y,
        x+width, y,
        x+width, y+height
    ];
}

function roadVertices() {
    return new Float32Array(rectangleVertices(-2.0, -0.4, 4.0, 0.8));
}
function robotBodyVertices() {
    return new Float32Array(rectangleVertices(-0.06, 0.0, 0.12, 0.3));
}
function robotHeadVertices() {
    return new Float32Array(rectangleVertices(-0.04, 0.0, 0.08, 0.08));
}
function robotLimbVertices() {
    return new Float32Array(rectangleVertices(-0.02, -0.2, 0.04, 0.2));
}

// ==================================================
// CLASSES DOS OBJETOS
// ==================================================

class SceneObject {
    constructor(vertices, color) {
        this.vertices = vertices;
        this.color = color; 
        this.modelTransform = m3.identity();
    }
    updateModelTransform(modelTransform) {
        this.modelTransform = modelTransform;
    }
}

class Road extends SceneObject {
    constructor() {
        super(roadVertices(), new Float32Array([0.2, 0.2, 0.2]));
    }
    draw(renderer) {
        renderer.draw(this);
    }
}

class RobotPart extends SceneObject {
    constructor(vertices, color, xPivot = 0.0, yPivot = 0.0) {
        super(vertices, color);
        this.xPivot = xPivot;
        this.yPivot = yPivot;
        this.theta = 0.0;
    }

    updateRotation(angle) {
        this.theta = angle;
    }

    updateModelTransform(parentTransform) {
        const localTransform = m3.multiply(
            m3.translation(this.xPivot, this.yPivot),
            m3.rotation(this.theta)
        );
        this.modelTransform = m3.multiply(parentTransform, localTransform);
    }
}

// ==================================================
// UNICO ROBÔ (ANIMAÇÕES DISTINTAS)
// ==================================================

class Robot {
    constructor(tx, ty, speed) {
        this.baseTx = tx;
        this.baseTy = ty;
        this.tx = tx;
        this.ty = ty;
        this.speed = speed;
        this.walkCycle = 0.0; 

        const gray = new Float32Array([0.7, 0.7, 0.7]);
        const red = new Float32Array([0.8, 0.2, 0.2]);
        const blue = new Float32Array([0.2, 0.2, 0.8]);

        this.body = new RobotPart(robotBodyVertices(), gray, 0.0, 0.0);
        this.head = new RobotPart(robotHeadVertices(), red, 0.0, 0.3);

        this.leftArm = new RobotPart(robotLimbVertices(), gray, -0.07, 0.25);
        this.rightArm = new RobotPart(robotLimbVertices(), gray, 0.07, 0.25);
        
        this.leftLeg = new RobotPart(robotLimbVertices(), blue, -0.04, 0.05);
        this.rightLeg = new RobotPart(robotLimbVertices(), blue, 0.04, 0.05);
    }

    move() {
        // 1. MOVIMENTO DO ROBÔ (Translação horizontal + Leve quique vertical)
        this.tx += this.speed;
        if (this.tx > 1.6 || this.tx < -1.6) {
            this.speed = -this.speed;
        }

        this.walkCycle += Math.abs(this.speed) * 25.0; 
        
        // Quique vertical do robô inteiro enquanto anda
        this.ty = this.baseTy + Math.abs(Math.sin(this.walkCycle * 2.0)) * 0.02;

        // 2. MOVIMENTO DA CABEÇA (Inclinação suave independente)
        const headAngle = Math.sin(this.walkCycle * 0.5) * 0.15;
        this.head.updateRotation(headAngle);

        // 3. MOVIMENTO DOS BRAÇOS (Balanço amplo)
        const armAngle = Math.sin(this.walkCycle) * 0.7; 
        this.leftArm.updateRotation(-armAngle);
        this.rightArm.updateRotation(armAngle);

        // 4. MOVIMENTO DAS PERNAS (Passada mais curta/diferente)
        const legAngle = Math.sin(this.walkCycle) * 0.4; 
        this.leftLeg.updateRotation(legAngle);
        this.rightLeg.updateRotation(-legAngle);

        // Atualiza a matriz global do robô
        const robotTransform = m3.translation(this.tx, this.ty);

        // Aplica a matriz às partes
        this.body.updateModelTransform(robotTransform);
        this.head.updateModelTransform(robotTransform);
        this.leftArm.updateModelTransform(robotTransform);
        this.rightArm.updateModelTransform(robotTransform);
        this.leftLeg.updateModelTransform(robotTransform);
        this.rightLeg.updateModelTransform(robotTransform);
    }

    draw(renderer) {
        renderer.draw(this.leftArm);
        renderer.draw(this.leftLeg);
        renderer.draw(this.body);
        renderer.draw(this.head);
        renderer.draw(this.rightArm);
        renderer.draw(this.rightLeg);
    }
}

// ==================================================
// CENA
// ==================================================

class Scene {
    constructor(gl, program) {
        this.renderer = new Renderer(gl, program);
        this.viewTransform = m3.setClippingWindow(-2.0, -1.0, 2.0, 1.0);
        this.renderer.defineViewTransform(this.viewTransform);
        
        this.road = new Road();
        // Apenas UM robô instanciado
        this.robot = new Robot(-0.8, -0.25, 0.005);
    }

    update() {
        this.robot.move();
    }

    draw() {
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.useProgram(program);

        this.road.draw(this.renderer);
        this.robot.draw(this.renderer);
    }

    execute() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.execute());
    }

    init() {
        requestAnimationFrame(() => this.execute());
    }
}

gl.clearColor(0.1, 0.1, 0.1, 1.0);
gl.viewport(0, 0, canvas.width, canvas.height);

const scene = new Scene(gl, program);
scene.init();
    </script>
</body>
</html>
